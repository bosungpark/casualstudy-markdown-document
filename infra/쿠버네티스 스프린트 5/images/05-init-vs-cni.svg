<text x="356" y="300" font-size="13" font-weight="700">앱</text>
<rect x="460" y="58" width="410" height="334" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="478" y="86" font-size="15" font-weight="700">Istio CNI 방식 (실습에서 전환)</text>
<rect x="480" y="100" width="370" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="494" y="124" font-size="13" font-weight="700">istio-cni-node · 노드당 1개 (DaemonSet)</text>
<text x="494" y="146" font-size="12">높은 권한은 여기에만 · 체인 CNI 플러그인 설치</text>
<text x="494" y="180" font-size="12" fill="#4B5563">파드가 만들어질 때 각 파드에 규칙을 넣는다</text>
