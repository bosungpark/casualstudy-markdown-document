<svg xmlns="http://www.w3.org/2000/svg" width="900" height="536" viewBox="0 0 900 536" role="img" aria-label="istio-init은 파드마다 높은 네트워크 권한으로 규칙을 넣고, Istio CNI는 노드마다 하나인 에이전트가 같은 핵심 규칙을 넣어 앱 파드에는 권한이 필요 없다" fill="#1F2937" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
