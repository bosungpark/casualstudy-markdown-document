<rect x="30" y="404" width="840" height="66" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="46" y="430" font-size="14" font-weight="700">핵심 규칙은 두 방식 모두 각 파드의 네트워크 네임스페이스에 들어간다 (노드 기본 네임스페이스에는 없음)</text>
<text x="46" y="454" font-size="13">나가는 TCP → 15001 · 들어오는 TCP → 15006 · UID 1337 제외 · CNI 쪽에는 15020 예외 2줄이 더 있다 (18줄 vs 20줄)</text>
<text x="30" y="496" font-size="14" font-weight="700">Istio CNI는 Calico 같은 기본 CNI를 대신하지 않는다. 파드 IP와 파드 네트워크는 기본 CNI가 만든다.</text>
<text x="28" y="522" font-size="12" fill="#6B7280">빨강 = 파드마다 높은 권한, 주황 = 권한이 한곳에 모임, 초록 = 권한 없음. 권한 값은 실습(Istio 1.31.4)의 securityContext에서 확인했다.</text>
</svg>
