<rect x="216" y="500" width="634" height="62" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="230" y="524" font-size="13" font-weight="700">Prometheus (monitoring · 스프린트 4에서 설치)</text>
<text x="230" y="545" font-size="12">PodMonitor → 사이드카 :15020 · ServiceMonitor → istiod :15014</text>
<text x="30" y="608" font-size="14" font-weight="700">같은 productpage에 두 길로 들어가고, Kiali는 Prometheus에 모인 메트릭으로 이 흐름을 그린다.</text>
<text x="28" y="634" font-size="12" fill="#6B7280">포트 번호는 실습에서 고정한 NodePort다(강의도 Istio API에 30011을 썼다). 회색 점선 상자(istio-cni-node)는 6단계에서 추가된다.</text>
