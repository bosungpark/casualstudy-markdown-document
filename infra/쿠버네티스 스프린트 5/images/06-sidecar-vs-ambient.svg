<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="사이드카 모드는 파드마다 L4와 L7 프록시를 두고, Ambient 모드는 노드마다 L4 프록시 ztunnel을 두고 L7이 필요할 때만 waypoint를 둔다" fill="#1F2937" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
