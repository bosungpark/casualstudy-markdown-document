<text x="506" y="228" font-size="13" font-weight="700">ztunnel · 노드당 1개 (DaemonSet)</text>
<text x="506" y="248" font-size="12">L4: mTLS · L4 정책 · TCP 지표</text>
<rect x="494" y="272" width="332" height="52" rx="8" fill="white" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="506" y="294" font-size="13" font-weight="700">waypoint (선택) · 서비스·네임스페이스 단위</text>
<text x="506" y="314" font-size="12">L7: 라우팅 · L7 정책 · HTTP 지표</text>
<text x="30" y="386" font-size="14">사이드카: 파드마다 Envoy가 L4·L7을 모두 처리한다 → 파드 수만큼 CPU·메모리를 예약한다.</text>
<text x="30" y="412" font-size="14">Ambient: L4는 노드의 ztunnel이, L7은 필요할 때 둔 waypoint가 처리한다 → ztunnel이 노드의 공유 지점이 된다.</text>
<text x="28" y="448" font-size="12" fill="#6B7280">점선 = 선택 구성. waypoint는 강의가 말한 "Ambient 모드를 위한 새 리소스"에 해당한다(보충). Ambient 쪽은 실습에서 실행하지 않았다.</text>
</svg>
