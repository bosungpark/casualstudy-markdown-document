kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# 노드포트를 127.0.0.1에만 연다. 강의처럼 "서비스의 NodePort를 바꾸면 접속된다"를 그대로 재현한다.
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30011 # Istio API 게이트웨이 (istio-ingressgateway)
        hostPort: 30011
        listenAddress: 127.0.0.1
      - containerPort: 30012 # Gateway API 게이트웨이 (bookinfo-gateway-istio)
        hostPort: 30012
        listenAddress: 127.0.0.1
      - containerPort: 30020 # Kiali
        hostPort: 30020
        listenAddress: 127.0.0.1
      - containerPort: 30090 # Prometheus
        hostPort: 30090
        listenAddress: 127.0.0.1
  - role: worker
  - role: worker
