<svg xmlns="http://www.w3.org/2000/svg" fill="#1F2937" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="cpuset의 함정: CPU 번호 순서대로 0부터 3을 주면 두 소켓에 걸쳐 L3 캐시를 나눠 쓰게 되고, 토폴로지를 읽어 한 소켓 안의 코어를 주면 그렇지 않다">
