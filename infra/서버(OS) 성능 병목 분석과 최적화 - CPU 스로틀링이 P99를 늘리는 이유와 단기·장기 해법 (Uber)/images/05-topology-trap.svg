  <rect x="0.5" y="0.5" width="899" height="435" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="32" y="40" class="title">cpuset의 함정 — CPU 번호 순서는 물리 위치가 아니다</text>

  <!-- panel 1: naive numbering -->
  <text x="32" y="74" class="hred">✗ 번호순으로 0-3을 주면 → 두 소켓에 걸친다 (원문 관측: P99 최대 500% 악화)</text>
