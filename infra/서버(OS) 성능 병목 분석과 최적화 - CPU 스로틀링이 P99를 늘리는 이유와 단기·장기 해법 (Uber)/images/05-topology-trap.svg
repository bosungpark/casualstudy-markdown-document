  <text x="32" y="398" class="note">칸 안의 숫자는 리눅스가 붙인 논리 CPU 번호다. 코어 하나에 하이퍼스레드 두 개(번호 두 개)가 있다. 번호 배치는 설명용 예시다.</text>
  <text x="32" y="417" class="note">원문: 번호는 연속적이지 않고 늘 같다는 보장도 없다. 하이퍼스레드를 1개 대신 2개 줘도 성능은 약 1.3배에 그칠 수 있다.</text>
