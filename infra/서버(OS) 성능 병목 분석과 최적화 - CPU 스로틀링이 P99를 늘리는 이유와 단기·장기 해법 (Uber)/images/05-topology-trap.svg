    .hblue { font-size: 15px; font-weight: 700; fill: #1D4ED8; }
    .sk { font-size: 13px; font-weight: 700; }
    .l3 { font-size: 12px; fill: #4B5563; text-anchor: middle; }
    .core { font-size: 12px; fill: #4B5563; text-anchor: middle; }
    .num { font-size: 13px; text-anchor: middle; }
    .numb { font-size: 13px; font-weight: 700; text-anchor: middle; }
