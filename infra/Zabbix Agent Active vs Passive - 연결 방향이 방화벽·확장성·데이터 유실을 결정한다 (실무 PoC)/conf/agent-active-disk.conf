# active 전용 에이전트 - 디스크 영속 버퍼(SQLite) 사용
PidFile=/tmp/zabbix_agent2.pid
LogType=console
DebugLevel=3
ControlSocket=/tmp/agent.sock

Server=zabbix-server
ListenPort=10050

ServerActive=zabbix-server
Hostname=poc-active-disk

RefreshActiveChecks=10
BufferSend=5
BufferSize=1000
# 영속 버퍼: 못 보낸 값을 SQLite 파일에 적어 두므로 프로세스 재시작을 견딘다.
EnablePersistentBuffer=1
PersistentBufferFile=/tmp/agent2-buffer.db
PersistentBufferPeriod=1h
