# passive 전용 에이전트
# 서버가 이 에이전트의 10050/TCP 로 "들어와야" 값이 생긴다.
PidFile=/tmp/zabbix_agent2.pid
LogType=console
DebugLevel=3
ControlSocket=/tmp/agent.sock

# Server: 이 주소에서 들어오는 inbound 연결만 허용 (passive)
Server=zabbix-server
ListenPort=10050
ListenIP=0.0.0.0

# ServerActive 를 비워 두면 active check 를 아예 하지 않는다.
# (7.0 에서 ServerActive 미설정이 곧 active 비활성)
