# inbound 차단 재현용 에이전트
# ListenIP 를 루프백으로 묶어 "방화벽/NAT 때문에 서버가 접속할 수 없는 호스트"를 흉내낸다.
# outbound 는 그대로 열려 있으므로 active check 만 살아남아야 한다.
PidFile=/tmp/zabbix_agent2.pid
LogType=console
DebugLevel=3
ControlSocket=/tmp/agent.sock

Server=zabbix-server
ListenPort=10050
ListenIP=127.0.0.1

ServerActive=zabbix-server
Hostname=poc-inbound-blocked

RefreshActiveChecks=10
BufferSend=5
BufferSize=1000
