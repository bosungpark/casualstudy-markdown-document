# active 전용 에이전트 - 메모리 버퍼만 사용
PidFile=/tmp/zabbix_agent2.pid
LogType=console
DebugLevel=3
ControlSocket=/tmp/agent.sock

Server=zabbix-server
ListenPort=10050

# ServerActive: 에이전트가 이 주소의 10051/TCP 로 "나가서" 설정을 받고 값을 올린다.
ServerActive=zabbix-server
# Hostname 은 프론트엔드의 host name 과 대소문자까지 정확히 같아야 한다.
Hostname=poc-active-mem

RefreshActiveChecks=10
BufferSend=5
BufferSize=1000
# 메모리 버퍼만: 프로세스가 죽으면 아직 못 보낸 값은 사라진다.
EnablePersistentBuffer=0
