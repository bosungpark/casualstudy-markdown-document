apiVersion: v1
kind: ConfigMap
metadata:
  name: sprint4-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sprint4.json: |
    {
      "uid": "sprint4-hands-on",
      "title": "Sprint 4 - 직접 바꾸는 모니터링",
      "tags": [
        "study",
        "sprint4"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "1. NGINX 요청 수/초 — ServiceMonitor 연결 후 표시",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(nginx_ingress_controller_requests{ingress=\"portal\"}[1m]))",
              "legendFormat": "portal",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "title": "2. 노드 CPU — 아직 IP로 표시",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))",
              "legendFormat": "{{instance}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "title": "3. 전체 앱 메모리 — 직접 frontend 라벨 조인으로 변경",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod)(container_memory_working_set_bytes{namespace=\"apps\",container!=\"\",container!=\"POD\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\"})",
              "legendFormat": "{{namespace}} / {{pod}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "title": "4. 노드 CPU 할당 가능량 — 직접 high-spec 라벨로 필터",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_node_status_allocatable{resource=\"cpu\",unit=\"core\"}",
              "legendFormat": "{{node}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
