port=0
interface=eth0
bind-interfaces
log-dhcp
log-facility=-
dhcp-authoritative

dhcp-range=172.30.0.100,172.30.0.150,255.255.255.0,1h
dhcp-option=option:router
dhcp-option=option:dns-server

# Legacy PXE ROM: receive the iPXE network boot program over TFTP.
dhcp-match=set:ipxe,175
dhcp-boot=tag:!ipxe,undionly.kpxe,pxe-server,172.30.0.2

# Chainloaded iPXE: receive the real boot script over HTTP instead of looping.
dhcp-boot=tag:ipxe,http://172.30.0.2:8080/boot.ipxe

enable-tftp
tftp-root=/srv/tftp
