<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="모듈 제거는 정상 서비스와 공격자를 모두 막아 서비스가 멈추고, bpf-lsm은 허용 목록의 정상 서비스만 통과시키고 공격자만 거부한다">
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #1F2937; }
    .title { font-size: 19px; font-weight: 700; }
    .pt { font-size: 16px; font-weight: 700; }
    .ps { font-size: 12px; fill: #6B7280; }
    .actor { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .gate { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .res { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .ban { font-size: 13px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="32" y="40" class="title">입구를 막는 두 방법 — 끄기 vs 좁히기</text>

  <!-- ========== Panel A: module removal ========== -->
  <rect x="30" y="60" width="405" height="280" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="50" y="90" class="pt">모듈 제거 (표준 권고)</text>
  <text x="50" y="108" class="ps">algif_aead 모듈을 내리고 재로드 금지</text>

  <rect x="55" y="124" width="160" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="135" y="149" class="actor">정상 서비스</text>
  <rect x="250" y="124" width="160" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="330" y="149" class="actor">공격자 프로세스</text>

  <line x1="135" y1="164" x2="135" y2="198" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="330" y1="164" x2="330" y2="198" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="55" y="202" width="355" height="38" rx="8" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="232" y="226" class="gate">AF_ALG 암호화 기능 자체가 없음</text>

  <text x="135" y="266" class="res" fill="#B91C1C">✗ 실패</text>
  <text x="330" y="266" class="res" fill="#B91C1C">✗ 실패</text>

  <rect x="55" y="284" width="355" height="38" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="232" y="308" class="ban" fill="#991B1B">정상 서비스도 멈춤 → 스테이징에서 롤백</text>

  <!-- ========== Panel B: bpf-lsm ========== -->
  <rect x="465" y="60" width="405" height="280" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="485" y="90" class="pt">bpf-lsm (실제로 적용)</text>
  <text x="485" y="108" class="ps">모듈은 그대로 두고 socket_bind 단계에서 검사</text>

  <rect x="490" y="124" width="160" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="570" y="149" class="actor">정상 서비스</text>
  <rect x="685" y="124" width="160" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="765" y="149" class="actor">공격자 프로세스</text>

  <line x1="570" y1="164" x2="570" y2="198" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="765" y1="164" x2="765" y2="198" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="490" y="202" width="355" height="38" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="667" y="226" class="gate">허용 목록에 있는 바이너리인가?</text>

  <text x="570" y="266" class="res" fill="#15803D">✓ 허용</text>
  <text x="765" y="266" class="res" fill="#B91C1C">✗ 거부</text>

  <rect x="490" y="284" width="355" height="38" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="667" y="308" class="ban" fill="#166534">서비스 유지, 공격 경로만 차단 → fleet 전체 적용</text>
</svg>
